<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Märchen – Deutsch 5 – HBG</title>
<style>
:root{--slate:#3E5668;--slate-pale:#D0DCE6;--rust-dark:#9E4E22;--rust:#D97A4A;--sage-dark:#4D8B3F;--sage:#7DBB6F;--bg:#F5F4F1;--text:#1E2A35;--muted:#5A6A78;--shadow:rgba(62,86,104,.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
header{background:var(--slate);color:#fff;padding:18px 0}
.c{max-width:900px;margin:0 auto;padding:0 28px}
header .c{display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.728rem;line-height:1.2}
.meta{font-size:.694rem;color:var(--slate-pale);text-transform:uppercase;letter-spacing:.06em}
.wm{font-weight:800;font-size:1.44rem}.wm span{font-size:.833rem;color:#EBA882;font-weight:600;margin-left:4px}
main{padding:32px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
a.card{display:block;background:#fff;border-radius:14px;padding:26px 26px 22px;box-shadow:0 2px 8px var(--shadow);text-decoration:none;color:var(--text);border-left:6px solid var(--rust);min-height:44px;transition:transform .15s,box-shadow .15s}
a.card.gn{border-left-color:var(--sage)}
a.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px var(--shadow)}
a.card:focus-visible{outline:3px solid var(--slate);outline-offset:3px}
.card h2{font-size:1.44rem;margin-bottom:6px}
.card p{color:var(--muted)}
.go{display:inline-block;margin-top:14px;font-weight:700;color:var(--rust-dark)}
a.gn .go{color:var(--sage-dark)}
footer{color:var(--muted);font-size:.833rem;padding:8px 0 32px}
</style>
</head>
<body>
<header><div class="c"><div><h1>Märchen</h1><div class="meta">HBG Dortmund · Deutsch · Klasse 5</div></div><div class="wm">HBG<span>SRL</span></div></div></header>
<main><div class="c">
<div class="grid">
<a class="card gn" href="apps/gn1-digital/"><h2>Gelingensnachweis 1</h2><p>Märchenmerkmale – am Laptop. Nur, wenn deine Lehrkraft es dir sagt.</p><span class="go">Starten →</span></a>
<a class="card" href="apps/kontroll-kiosk/"><h2>Kontroll-Kiosk</h2><p>Blattnummer eintippen, dann Tipp oder Lösung ansehen. Nur beim Üben.</p><span class="go">Öffnen →</span></a>
</div>
</div></main>
<footer><div class="c">Es werden keine Namen gespeichert.</div></footer>
</body>
</html>
